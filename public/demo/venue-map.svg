<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="Demo venue map">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3f2"/><stop offset="100%" stop-color="#8ecae6"/>
    </linearGradient>
    <pattern id="sand" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f4e7cf"/><circle cx="2" cy="3" r="0.7" fill="#e6d5b4"/><circle cx="6" cy="6" r="0.7" fill="#e6d5b4"/>
    </pattern>
  </defs>
  <rect width="1000" height="700" fill="#eef3ec"/>
  <rect x="0" y="520" width="1000" height="180" fill="url(#sea)"/>
  <rect x="0" y="470" width="1000" height="60" fill="url(#sand)"/>
  <path d="M0 470 Q 250 450 500 472 T 1000 468 L1000 530 L0 530 Z" fill="url(#sand)"/>
  <g fill="#dfe8dc" stroke="#c9d6c4" stroke-width="2">
    <rect x="60" y="90" width="180" height="130" rx="10"/>
    <rect x="430" y="150" width="200" height="150" rx="10"/>
    <rect x="700" y="380" width="200" height="120" rx="10"/>
    <rect x="130" y="420" width="150" height="110" rx="10"/>
    <rect x="380" y="360" width="160" height="110" rx="10"/>
  </g>
  <g stroke="#d8d2c4" stroke-width="26" stroke-linecap="round" fill="none">
    <path d="M100 300 H 900"/><path d="M300 80 V 640"/><path d="M660 120 V 560"/>
  </g>
  <g stroke="#ffffff" stroke-width="3" stroke-dasharray="14 12" fill="none">
    <path d="M100 300 H 900"/><path d="M300 80 V 640"/><path d="M660 120 V 560"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="19" font-weight="600" fill="#4a5a55">
    <text x="150" y="160">Hotel</text>
    <text x="530" y="230">Main Stage</text>
    <text x="800" y="445">Beach Club</text>
    <text x="205" y="480">Quiet Room</text>
    <text x="460" y="420">Workshops</text>
  </g>
  <text x="30" y="670" font-family="system-ui, sans-serif" font-size="16" fill="#5c6b66">
    Demo venue map — replace with the real site plan
  </text>
</svg>
