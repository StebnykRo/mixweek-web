# Local stack for development. Production runs the same images behind a CDN and
# a private network (docs/01-architecture.md §1, §12) — Postgres and Redis are
# never exposed publicly there.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app_admin
      POSTGRES_PASSWORD: app_admin_dev
      POSTGRES_DB: mixweek_dev
    ports: ['5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_admin -d mixweek_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ['9000:9000', '9001:9001']
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
